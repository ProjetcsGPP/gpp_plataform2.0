# Proxy local opt-in para três processos em loopback. Não substitui o proxy atual.
name: gpp-isolamento-tres

services:
  proxy:
    image: gpp-publicacoes/nginx-dev:1.30.6-alpine-security-20261026
    network_mode: host
    restart: "no"
    volumes:
      - ./config/nginx/nginx-isolamento-tres.conf:/etc/nginx/nginx.conf:ro
      - ./runtime/tls:/etc/nginx/tls:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true

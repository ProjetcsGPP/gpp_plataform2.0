worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format structured escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time}';

    access_log /dev/stdout structured;
    error_log /dev/stderr warn;

    server_tokens off;
    client_max_body_size 25m;
    client_body_timeout 30s;
    send_timeout 30s;
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_req_status 429;

    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/tls/dev.crt;
        ssl_certificate_key /etc/nginx/tls/dev.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /infra/healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "private, no-store" always;
            return 200 "ok\n";
        }

        location = /infra/cache-public-contract {
            default_type application/json;
            add_header Cache-Control "public, max-age=60" always;
            return 200 '{"status":"public-cache-contract"}\n';
        }

        location = /infra/cache-private-contract {
            default_type application/json;
            add_header Cache-Control "private, no-store" always;
            return 200 '{"status":"private-cache-contract"}\n';
        }

        location = /infra/log-redaction-contract {
            default_type text/plain;
            return 204;
        }

        location /api/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            proxy_pass http://host.docker.internal:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://host.docker.internal:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}

# Ensaio opt-in: três processos no mesmo host, apenas em loopback.
# TLS termina neste proxy; todos os upstreams HTTP devem escutar em 127.0.0.1.
# Não usar entre hosts nem como proxy público institucional.
worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout combined;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 25m;

    server {
        listen 127.0.0.1:58445 ssl;
        server_name localhost;
        ssl_certificate /etc/nginx/tls/dev.crt;
        ssl_certificate_key /etc/nginx/tls/dev.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /infra/healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ^~ /interno/ { return 404; }

        location = /api/carga-org-lot/health/ {
            proxy_pass http://127.0.0.1:8001/api/health/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/carga-org-lot/ready/ {
            proxy_pass http://127.0.0.1:8001/api/ready/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        location = /api/pub-institucional/health/ {
            proxy_pass http://127.0.0.1:8002/api/health/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /api/pub-institucional/ready/ {
            proxy_pass http://127.0.0.1:8002/api/ready/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        location ^~ /api/carga-org-lot/ {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location ^~ /api/pub-institucional/ {
            proxy_pass http://127.0.0.1:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location ^~ /api/public/v1/publicacoes-institucionais/ {
            proxy_pass http://127.0.0.1:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location ^~ /ws/carga-org-lot/ {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Proto https;
        }

        location ^~ /ws/pub-institucional/ {
            proxy_pass http://127.0.0.1:8002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location / {
            default_type text/plain;
            add_header Cache-Control "private, no-store" always;
            return 503 "superficie nao habilitada neste piloto\n";
        }
    }
}

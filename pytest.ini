[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
testpaths = apps common
python_files = tests.py test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --reuse-db
    -v
    # Tracebacks longos do driver PostgreSQL podem incluir conninfo com senha.
    # Manter o erro e sua localização, sem imprimir variáveis locais sensíveis.
    --tb=line
    --cov=apps
    --cov=common
    --cov-report=term-missing
